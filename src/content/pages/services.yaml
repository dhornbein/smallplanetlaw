seo:
  title: Estate Planning Services
  description: >-
    Comprehensive, holistic estate planning services in Denver. Wills, trusts,
    green estate planning, and legacy planning for Colorado families.
hero:
  heading: Estate Planning Services
  intro: >-
    Comprehensive, values-driven planning designed to protect your loved ones,
    honor your legacy, and reflect your commitment to our shared world.
  image: ../../assets/content/pages/services/hero/image.jpg
  imageTall: ../../assets/content/pages/services/hero/imageTall.jpg
approach:
  heading: Our Approach
  body: |-
    At Small Planet Law, we believe estate planning should be clear, compassionate, and customized to your unique situation. We take the time to understand your family, your values, and your goals — then craft a plan that actually works when you need it most.

    Whether you're creating your first will, establishing a trust for your family, or weaving green options into an existing plan, we're here to guide you every step of the way. We pride ourselves on our client-centered practices.
  features:
    - title: Relationship
      description: >-
        This is just the beginning of something special. We offer complimentary
        reviews of your plan every 3 years to ensure it's always up to date.
        Small Planet Law will be there for you and your family when you need us.
    - title: Flat Fees
      description: >-
        Unlike traditional law firms, Small Planet Law is strictly flat-fee, so
        there are never any surprises! You'll select your own fee up-front based
        on the plan you want and the needs of your unique situation.
    - title: Communication
      description: >-
        Free flowing communication is the bedrock of every successful
        relationship. We welcome and encourage open communication — never
        hesitate to ask questions, share ideas, and provide feedback!
    - title: Virtual Planning
      description: >-
        We get it — life is so busy, and Colorado is so big! We can accomplish
        all or any portion of the planning process over Zoom to meet your needs
        wherever you are in Colorado.
    - title: Legacy Interviews
      description: >-
        Your most precious assets are the intangibles — your memories, beliefs,
        values, and dreams for the future. With our unique Legacy Interview
        process you will build a lasting record of what matters most to you.
    - title: Holistic Approach
      description: >-
        Our personal approach to planning cares for the whole human. With our
        trusted guidance, planning for both the knowns and unknown of life frees
        you to live with intention, clarity, and purpose.
  link:
    label: Learn more about our planning process →
    href: /faq#planning-process
offer:
  heading: What We Offer
  body: >-
    Comprehensive, customized planning for individuals and families — because
    peace of mind should last a lifetime. Our holistic approach goes beyond
    basic documents. We help you create a complete plan that addresses your
    assets, your healthcare wishes, your family dynamics, and your long-term
    goals.
  services:
    - title: Life & Legacy Planning
      description: >-
        Estate planning is a gift to the people we love. Our unique approach to
        planning is comprehensive, meaningful, and proven.
    - title: Kids Protection Plan
      description: >-
        Naming legal guardians for your minor children is the first step to keep
        your family out of court and conflict. We take it to the next level with
        a comprehensive plan to protect your little ones no matter what happens.
    - title: Legacy Interviews
      description: >-
        Preserving and protecting the intangibles of your legacy — your
        memories, beliefs, and values — is just as important as the tangibles.
        With your initial plan and every 3-year review, we will add to your
        library of legacy interviews.
    - title: Pets
      description: >-
        We support you to carefully plan and provide for the special animals in
        your life. We always name alternative pet caretakers and support you in
        considering how to provide for your pets for their whole lives.
    - title: Asset Protection
      description: >-
        We work hard to ensure your assets truly benefit the people and causes
        you love. Thoughtful planning adds layers of protection so your legacy
        stays safe from outside claims and risks.
    - title: Green Planning
      description: >-
        To the extent you choose, we can weave sustainability and green causes
        into your plan and legacy. With our unique expertise and connections,
        you can create an estate plan that honors both your loved ones and the
        Earth.
  link:
    label: See what's included in a Life & Legacy Plan →
    href: /faq#legal-documents
green:
  heading: Green Estate Planning
  body: |-
    At Small Planet Law, we believe preserving your legacy should reflect your values. As an eco-conscious Colorado small business, sustainability is at the heart of everything we do—from our net zero-carbon practices to the partners we recommend. Working with Small Planet Law to craft your estate plan is one way to align your life and your death with your love for our precious planet.

    And, to the extent you choose, we can weave sustainability and green causes into your plan itself. With our unique expertise and connections, you can create an estate plan that honors both your loved ones and the Earth.
  features:
    - title: Sustainable Farewells
      description: >-
        We offer expert guidance on eco-conscious burial and memorial options.
        We will capture your wishes in your estate plan and can connect you with
        Colorado providers who share your commitment to sustainability and
        dignity.
    - title: Legacy-Driven Giving
      description: >-
        We help you incorporate the causes you care about into your plan. A gift
        of any size can make a difference and a lasting statement about your
        values and hopes for the future—and we'll help you craft it with
        intention.
    - title: Ethical Financial Guidance
      description: >-
        We connect interested clients with trusted Colorado-based financial
        advisors who specialize in ESG (Environmental, Social, and Governance)
        investing, renewable energy, and climate solutions — so your financial
        future can align with your environmental and social values.
    - title: Giving Back, Together
      description: >-
        For every estate plan we complete, Small Planet Law makes a donation to
        your choice of our featured environmental nonprofits. It's one more way
        your plan can give back to our Earth.
  closing: >-
    We believe your legacy should reflect your environmental values. At Small
    Planet Law, we integrate eco-conscious practices and partnerships into every
    aspect of our work, and we help you explore eco-conscious options for
    charitable giving, investments, and end-of-life planning.
  link:
    label: Learn more about green estate planning →
    href: /faq#green-estate-planning
closingHeading: Start Your Plan Today!
