seo:
  title: Wills, Trusts & Green Estate Planning in Colorado
  description: >-
    Small Planet Law LLC offers personalized estate planning in Colorado,
    including wills, trusts, powers of attorney, and green legacy options. Clear
    guidance, sustainable choices, and expert legal support that puts people and
    the planet first.
hero:
  heading: Protect What Matters Most
  intro: >
    Small Planet Law helps families design estate plans that honor their loved
    ones and their values, including care for the planet.
  image: ../../assets/content/pages/home/hero/image.jpg
difference:
  heading: The Small Planet Difference
  subheading: Estate Planning That Feels Human and Aligned With Your Values.
  body: >
    We believe estate planning should feel like peace of mind, not paperwork. At
    Small Planet Law, we combine professional excellence with genuine care —
    guiding you to create a plan that truly works when it matters most.
  features:
    - icon: heart
      title: Holistic & Relationship-Based
      description: >
        We guide you through every step with care and clarity, ensuring your
        plan truly works when needed.
    - icon: globe
      title: Environmentally Conscious
      description: >
        Sustainable practices are woven into every aspect of our operations and
        your planning options.
    - icon: users
      title: Here for You and Your Family for Life
      description: >
        We serve as trusted advisors for life, adapting your plan as your
        circumstances evolve.
services:
  heading: What We Offer
  cards:
    - title: Holistic Estate Planning
      description: >
        Comprehensive, customized planning for individuals and families —
        because peace of mind should last a lifetime.
    - title: Legacy & Family Trusts
      description: >
        Preserve your wealth, values, and impact across generations with expert,
        caring guidance.
    - title: Green Estate Planning
      description: >
        Align your plan with your love for our world. Explore sustainable
        options for your estate and memorial wishes.
  buttonLabel: Explore All Services
green:
  heading: A Greener Way to Take Care
  body: >
    We Care for the Planet — and Your Legacy. At Small Planet Law, we help
    Coloradans create legacy plans that honor people, planet, and purpose. From
    ESG-aligned financial advisor referrals to charitable giving and sustainable
    burial options, our green estate planning services make it easy to protect
    what matters—ethically and intentionally.
  buttonLabel: Learn About Green Planning
  checklist:
    - title: Sustainable Fairwells
      description: |
        Expertise in Colorado eco-conscious burial and memorial options.
    - title: Green Giving & Investing
      description: >
        Align your money with your values, after you're gone and while you're
        living too.
    - title: Giving Back, Together
      description: >
        With each plan, Small Planet Law donates to an environmental nonprofit
        of your choice.
testimonial:
  quote: >-
    Our clients are thoughtful, caring people who want their estate plans to
    reflect who they are,  their love for their families, and their stewardship
    of the planet.
  name: Roberta “Bobbie” Mooney
  role: Founder, Small Planet Law
