seo:
  title: Green Estate Planning
  description: >-
    Eco-conscious estate planning that aligns with your values. ESG investing
    guidance, sustainable memorial options, and legacy-driven giving in
    Colorado.
intro:
  heading: Green Estate Planning with Purpose
  body: >-
    At Small Planet Law, we believe your legacy should reflect your values. As
    an eco-conscious Colorado law firm, sustainability is at the heart of
    everything we do—from our paperless practices to the partners we recommend.
    Our green estate planning services are designed to help you protect what
    matters most while honoring the planet we share.
callout:
  heading: Your Values, Your Legacy
  body: >-
    From sustainable investments to eco-conscious memorial planning, we help you
    create an estate plan that honors both your loved ones and the Earth.
leadIn: "Here's how we make that happen:"
faqLink:
  label: Learn more in our FAQ →
  href: /faq#green-estate-planning
features:
  - icon: dollar
    title: Ethical Financial Guidance
    description: >-
      We connect interested clients with trusted Colorado-based financial
      advisors who specialize in ESG (Environmental, Social, and Governance)
      investing—so your financial future can align with your environmental and
      social values.
  - icon: heart
    title: Legacy-Driven Giving
    description: >-
      Whether your estate is modest or substantial, we help you incorporate the
      causes you care about into your plan. A gift of any size can make a bold,
      lasting statement about your hopes for the future—and we'll help you craft
      it with intention.
  - icon: globe
    title: Sustainable Farewells
    description: >-
      We offer expert guidance on green burial and eco-conscious memorial
      options, connecting you with Colorado providers who share your commitment
      to sustainability and dignity.
  - icon: planet
    title: Giving Back, Together
    description: >-
      For every estate plan we complete, Small Planet Law makes a donation to one
      of three featured environmental nonprofits—chosen by you. It's one more
      way your plan can give back to our Earth.
buttonLabel: Start Your Green Estate Plan
